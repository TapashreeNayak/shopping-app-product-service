services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: shopwise-oracle
    ports: ["1521:1521"]
    environment:
      ORACLE_PASSWORD: "OracleSysLocal123"
      APP_USER: "SHOPWISE"
      APP_USER_PASSWORD: "ShopwiseLocal123"
    volumes: ["shopwise-oracle-data:/opt/oracle/oradata"]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
volumes:
  shopwise-oracle-data:
