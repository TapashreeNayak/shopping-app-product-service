server:
  port: 8081
  shutdown: graceful
spring:
  application:
    name: product-service
  datasource:
#    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
#    username: ${DB_USERNAME:SHOPWISE}
#    password: ${DB_PASSWORD:ShopwiseLocal123}
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: SHOPPING_APP
    password: shop123
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      #maximum-pool-size: ${DB_POOL_MAX:10}
      maximum-pool-size: 10
      #minimum-idle: ${DB_POOL_MIN:2}
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    com.shopwise.product: INFO
    org.hibernate.SQL: INFO
